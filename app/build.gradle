apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.ghahremani.kamionfroshir"
    compileSdk 34
    defaultConfig {
        applicationId "com.ghahremani.kamionfroshir"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH") ?: "release.jks"
            def ksPass = System.getenv("KEYSTORE_PASSWORD") ?: "kamion123"
            def keyAlias = System.getenv("KEY_ALIAS") ?: "kamion"
            def keyPass = System.getenv("KEY_PASSWORD") ?: "kamion123"
            storeFile file(ksPath)
            storePassword ksPass
            keyAlias keyAlias
            keyPassword keyPass
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.24")
}
