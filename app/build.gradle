apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.ghahremani.kamionfroshir"
    compileSdk 34
    defaultConfig {
        applicationId "com.ghahremani.kamionfroshir2"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }
    signingConfigs {
    release {
        def myKsPath = System.getenv("KEYSTORE_PATH") ?: "release.jks"
        def myKsPass = System.getenv("KEYSTORE_PASSWORD") ?: "kamion123"
        def myKeyA = System.getenv("KEY_ALIAS") ?: "kamion"
        def myKeyP = System.getenv("KEY_PASSWORD") ?: "kamion123"
        storeFile = file(myKsPath)
        storePassword = myKsPass
        keyAlias = myKeyA
        keyPassword = myKeyP
    }
}
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.24")
}
